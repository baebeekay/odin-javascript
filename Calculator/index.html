<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="calculator">
    <div class="screen">
      <div class="first-number"></div>
      <div class="operatordiv"></div>
      <div class="second-number" ></div>  
    </div>
    <div class="keys">
      <button class="numbers">7</button>
      <button class="numbers">8</button>
      <button class="numbers">9</button>
      <button class="operator">/</button>
    </div>
    <div class="keys">
      <button class="numbers">4</button>
      <button class="numbers">5</button>
      <button class="numbers">6</button>
      <button class="operator">x</button>
    </div>
    <div class="keys">
      <button class="numbers">1</button>
      <button class="numbers">2</button>
      <button class="numbers">3</button>
      <button class="operator">-</button>
    </div>
    <div class="keys">
      <button class="numbers">0</button>
      <button class="period">.</button>
      <button class="operator">+</button>
      <button class="numbers, d" style="background-color: orange;">=</button>
     
    </div>
    <div class = keys>
      <button>Del</button>
      <button class="numbers"  style="background-color: rgb(232, 182, 182)">Clear</button>
    </div>

  </div>
  </body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome To-Do App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            @apply bg-gray-100 text-gray-800;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; /* bg-slate-400 */
        }

        .priority-low { @apply bg-green-100 text-green-800; }
        .priority-medium { @apply bg-yellow-100 text-yellow-800; }
        .priority-high { @apply bg-red-100 text-red-800; }

        .modal-overlay {
            @apply fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50;
        }

        .modal-content {
            @apply bg-white rounded-xl shadow-lg w-full max-w-lg p-6 transform transition-all;
        }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- Sidebar for Projects -->
    <aside class="w-64 bg-white border-r border-gray-200 p-4 flex flex-col">
        <h2 class="text-2xl font-bold mb-4">Projects</h2>
        <div id="projects-list" class="flex-grow overflow-y-auto pr-2 space-y-2">
            <!-- Project items will be rendered here -->
        </div>

        <!-- Add Project Button -->
        <div class="mt-4">
            <input type="text" id="new-project-name" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="New Project Name">
            <button id="add-project-btn" class="mt-2 w-full bg-blue-500 text-white py-2 rounded-lg font-semibold hover:bg-blue-600 transition">Add Project</button>
        </div>
    </aside>

    <!-- Main Content Area for To-Dos -->
    <main class="flex-grow p-6 flex flex-col">
        <header class="flex justify-between items-center mb-6">
            <h1 id="current-project-title" class="text-3xl font-bold"></h1>
            <button id="add-todo-btn" class="bg-blue-500 text-white py-2 px-4 rounded-lg font-semibold hover:bg-blue-600 transition">Add To-Do</button>
        </header>
        <div id="todos-list" class="flex-grow overflow-y-auto space-y-4">
            <!-- To-do items will be rendered here -->
        </div>
    </main>

    <!-- To-Do Details/Edit Modal -->
    <div id="todo-modal" class="hidden modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title" class="text-2xl font-bold mb-4">Add New To-Do</h3>
            <form id="todo-form" class="space-y-4">
                <div>
                    <label for="todo-title" class="block text-sm font-medium text-gray-700">Title</label>
                    <input type="text" id="todo-title" name="title" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="todo-description" class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea id="todo-description" name="description" rows="3" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>
                <div>
                    <label for="todo-due-date" class="block text-sm font-medium text-gray-700">Due Date</label>
                    <input type="date" id="todo-due-date" name="dueDate" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="todo-priority" class="block text-sm font-medium text-gray-700">Priority</label>
                    <select id="todo-priority" name="priority" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div>
                    <label for="todo-notes" class="block text-sm font-medium text-gray-700">Notes</label>
                    <textarea id="todo-notes" name="notes" rows="3" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="close-modal-btn" class="bg-gray-200 text-gray-800 py-2 px-4 rounded-lg font-semibold hover:bg-gray-300 transition">Cancel</button>
                    <button type="submit" id="save-todo-btn" class="bg-green-500 text-white py-2 px-4 rounded-lg font-semibold hover:bg-green-600 transition">Save To-Do</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirmation Modal for Deletion -->
    <div id="delete-modal" class="hidden modal-overlay">
        <div class="modal-content text-center">
            <h3 class="text-2xl font-bold mb-4">Are you sure?</h3>
            <p class="mb-6">This action cannot be undone. Do you want to delete this to-do item?</p>
            <div class="flex justify-center space-x-4">
                <button id="cancel-delete-btn" class="bg-gray-200 text-gray-800 py-2 px-4 rounded-lg font-semibold hover:bg-gray-300 transition">Cancel</button>
                <button id="confirm-delete-btn" class="bg-red-500 text-white py-2 px-4 rounded-lg font-semibold hover:bg-red-600 transition">Delete</button>
            </div>
        </div>
    </div>
</body>
</html>
